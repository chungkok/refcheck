name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"     # weekly dependency vulnerability check

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - name: Offline tests (no network; NCBI is mocked)
        run: python -m pytest -q
        env:
          REFCHECK_CACHE: ""

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install bandit pip-audit
      - name: Static analysis
        run: bandit -q -r refcheck app.py refcheck_cli.py
      - name: Known vulnerabilities in pinned dependencies
        run: pip-audit -r requirements-lock.txt
